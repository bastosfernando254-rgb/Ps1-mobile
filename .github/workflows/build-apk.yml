name: Build PS1 Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NDK_VERSION: 27.0.12077973
  CMAKE_VERSION: 3.22.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pacotes são separados por ESPAÇO; ";" faz parte do nome do pacote.
      # A versão do CMake é 3.22.1 (3.22.1.1 não existe).
      - name: Configurar Android SDK e NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.0
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}

      - name: Exportar caminho do NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Baixar cabeçalho Libretro
        run: |
          set -euo pipefail
          mkdir -p app/src/main/cpp
          curl -fL --retry 3 --retry-delay 3 \
            https://raw.githubusercontent.com/libretro/RetroArch/master/libretro-common/include/libretro.h \
            -o app/src/main/cpp/libretro.h
          test -s app/src/main/cpp/libretro.h

      - name: Baixar núcleo PCSX-ReARMed ARM64
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/pcsx-rearmed

          curl -fL --retry 3 --retry-delay 3 \
            https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pcsx_rearmed_libretro_android.so.zip \
            -o /tmp/pcsx-rearmed.zip

          unzip -jo /tmp/pcsx-rearmed.zip -d /tmp/pcsx-rearmed

          CORE=$(find /tmp/pcsx-rearmed -type f -name "*.so" | head -n 1)
          test -n "$CORE"

          install -m 0644 "$CORE" \
            app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_libretro.so

      - name: Verificar arquivos nativos
        run: |
          for f in \
            app/src/main/cpp/libretro.h \
            app/src/main/cpp/libretro_frontend.cpp \
            app/src/main/cpp/CMakeLists.txt \
            app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_libretro.so
          do
            if [ ! -s "$f" ]; then
              echo "::error::Arquivo ausente ou vazio: $f (precisa estar commitado no repositório)"
              exit 1
            fi
          done

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PS1-Mobile-ARM64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
