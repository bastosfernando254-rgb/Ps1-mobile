
name: Build PS1 Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK e NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools;ndk;27.0.12077973;cmake;3.22.1.1'

      - name: Instalar SDK Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Baixar cabeçalho Libretro
        run: |
          set -e
          mkdir -p app/src/main/cpp

          curl -fL --retry 3 \
            https://raw.githubusercontent.com/libretro/RetroArch/master/libretro-common/include/libretro.h \
            -o app/src/main/cpp/libretro.h

          test -s app/src/main/cpp/libretro.h

      - name: Baixar núcleo PCSX-ReARMed ARM64
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a

          curl -fL --retry 3 \
            https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pcsx_rearmed_libretro_android.so.zip \
            -o /tmp/pcsx-rearmed.zip

          mkdir -p /tmp/pcsx-rearmed
          unzip -jo /tmp/pcsx-rearmed.zip -d /tmp/pcsx-rearmed

          CORE=$(find /tmp/pcsx-rearmed -type f -name "*.so" | head -n 1)

          test -n "$CORE"

          install "$CORE" \
            app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_libretro.so

      - name: Verificar arquivos nativos
        run: |
          test -s app/src/main/cpp/libretro.h
          test -s app/src/main/cpp/libretro_frontend.cpp
          test -s app/src/main/cpp/CMakeLists.txt
          test -s app/src/main/jniLibs/arm64-v8a/libpcsx_rearmed_libretro.so

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PS1-Mobile-ARM64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
